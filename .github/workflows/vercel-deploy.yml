# Déploiement Vercel en production, authentifié par jeton.
#
# Pourquoi cette méthode
# ----------------------
# Le projet appartient à l'équipe OLIVEIRA. Vercel refuse tout déploiement dont
# l'auteur du dernier commit n'est pas membre de l'équipe — et ce contrôle
# s'applique aussi bien à un push qu'à un Deploy Hook. Constaté le 12/08/2026 :
# le hook renvoie bien HTTP 201, puis le build est refusé.
#
# Ici, le site est construit dans GitHub Actions puis téléversé déjà compilé
# (`--prebuilt`). Aucun commit n'est soumis à Vercel, donc **aucun contrôle
# d'appartenance ne s'applique**. L'authentification se fait par le jeton, qui
# appartient à Jonathan.
#
# Secrets et variables à configurer — une seule fois
# --------------------------------------------------
#   VERCEL_TOKEN    (secret)   Vercel > Account Settings > Tokens, scope OLIVEIRA
#
# C'est le seul secret a fournir. L'identifiant d'equipe (VERCEL_ORG_ID) est
# resolu automatiquement au moment du deploiement : le job interroge l'API
# Vercel avec le jeton, parcourt les equipes accessibles et retient celle qui
# possede reellement ce projet. Evite d'avoir a le chercher dans l'interface,
# et evite surtout de se tromper d'equipe.
#
# L'identifiant du projet est public et figure déjà dans l'URL du Deploy Hook,
# il est donc écrit en clair ci-dessous.
#
# Le Deploy Hook reste utile pour **Sanity** : une publication de contenu ne
# passe par aucun commit, donc aucun contrôle d'auteur.

name: Déploiement Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

env:
  VERCEL_PROJECT_ID: prj_U8Cr4rcu6qYTAWgMbTq8PpHPt8bj

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que le jeton est configuré
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::Secret VERCEL_TOKEN manquant."
            echo "Voir la procédure en tête de .github/workflows/vercel-deploy.yml"
            exit 1
          fi

      - name: Résoudre l'identifiant de l'équipe propriétaire du projet
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          teams=$(curl -sS --fail-with-body \
                    -H "Authorization: Bearer $TOKEN" \
                    https://api.vercel.com/v2/teams | jq -r '.teams[].id')
          if [ -z "$teams" ]; then
            echo "::error::Le jeton ne donne acces a aucune equipe. Verifier sa portee."
            exit 1
          fi
          for t in $teams; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
                     -H "Authorization: Bearer $TOKEN" \
                     "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$t")
            if [ "$code" = "200" ]; then
              echo "Equipe proprietaire trouvee : $t"
              echo "VERCEL_ORG_ID=$t" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Aucune equipe accessible par ce jeton ne possede le projet $VERCEL_PROJECT_ID."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer la CLI Vercel
        run: pnpm add -g vercel@latest

      # Récupère la configuration et les variables d'environnement du projet,
      # pour que le build local soit identique à celui que ferait Vercel.
      - name: Récupérer la configuration du projet
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construire le site
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déployer en production
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Déployé : $url"
          echo "### Déploiement en production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # Témoin de bon déploiement : le sitemap annoncé dans robots.txt. C'était
      # précisément le bug d'origine — il pointait vers l'ancien domaine Wix,
      # qui ne résout plus.
      - name: Vérifier la mise en ligne
        run: |
          for i in $(seq 1 10); do
            sleep 15
            if curl -sS --max-time 20 https://www.studiojonathanoliveira.fr/robots.txt \
                 | grep -qi "^Sitemap: https://www.studiojonathanoliveira.fr"; then
              echo "En ligne, sitemap correct."
              exit 0
            fi
          done
          echo "::warning::Déploiement effectué mais le sitemap attendu n'est pas encore servi (cache CDN ?)."
