name: Sanity seed (manuel)

# Lance scripts/sanity-seed.ts depuis l'infra GitHub (réseau ouvert vers Sanity),
# l'environnement Claude Code étant bloqué par politique réseau. Déclenché à la
# main depuis l'onglet Actions. Idempotent (createOrReplace) : réécrase les docs
# seedés. NE PAS lancer après que Jonathan a commencé à éditer dans le Studio.
#
# Secrets requis (repo → Settings → Secrets and variables → Actions) :
#   - PUBLIC_SANITY_PROJECT_ID : l'ID du projet Sanity (ex. 16ruqqd3)
#   - SANITY_API_TOKEN         : un token EDITOR (temporaire, à révoquer après)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Taper 'seed' pour confirmer (écrase les documents seedés)"
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: sanity-seed
  cancel-in-progress: false

jobs:
  seed:
    if: ${{ github.event.inputs.confirm == 'seed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Seed du dataset Sanity
        run: pnpm sanity:seed
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: production
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
