name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Annule les runs en cours sur la même branche/PR (économise les minutes Actions)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build + Lint + Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: Type-check (astro check)
        run: pnpm check

      - name: ESLint
        run: pnpm exec eslint . --max-warnings 0

      - name: Build production
        # PUBLIC_SITE_URL fourni pour que le sitemap soit cohérent en CI.
        # Pas d'env vars Resend/Turnstile : l'action endpoint utilise des
        # fallbacks runtime, le build SSG passe sans.
        env:
          PUBLIC_SITE_URL: https://www.jonathanoliveira.fr
        run: pnpm build
