pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{astro,ts,tsx,js,jsx,css,md,json,yml}'
      run: pnpm exec prettier --check {staged_files}
    eslint:
      glob: '*.{astro,ts,tsx,js,jsx}'
      run: pnpm exec eslint {staged_files}
    typecheck:
      glob: '*.{ts,tsx,astro}'
      run: pnpm exec astro check
    # Garde-fou couleurs : refuse tout hex hardcodé hors des 2 fichiers
    # autorisés (palette brute + helper JS). Voir _brief/charte-couleurs.md.
    # Logique en Node (cross-platform) — l'ancien hook shell inline plantait
    # sous Windows (lefthook n'invoque pas le même shell selon l'OS).
    no-hardcoded-hex:
      glob: '*.{astro,ts,tsx,css}'
      run: node scripts/check-no-hex.mjs {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
